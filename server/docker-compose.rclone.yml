services:
  rclone-gdrive:
    image: rclone/rclone:latest
    command:
      - serve
      - webdav
      - --addr=:8080
      - --auth-proxy=/bridge/proxy/auth-proxy.sh
      - --vfs-cache-mode=writes
      - --dir-cache-time=1m
    volumes:
      - /data/gdrive-bridge/proxy:/bridge/proxy:ro
      - /data/gdrive-bridge/users:/bridge/users:ro
    restart: unless-stopped
